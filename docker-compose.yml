services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: region_control_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./region_control.db
      - REGION_NAME=Сарыарқа облысы
      - LLM_PROVIDER=mock
      - SECRET_KEY=super-secret-key-regioncontrol-akimat-gton-2026
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: region_control_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
